<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- CAN Analyzer app icon: digital CAN bits on the left turn into a smooth
       decoded signal on the right. Drawn for this project. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7E66FF"/>
      <stop offset="1" stop-color="#3B279F"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#shine)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="5" stroke-linecap="round">
    <line x1="44" y1="84" x2="212" y2="84"/>
    <line x1="44" y1="172" x2="212" y2="172"/>
  </g>
  <path d="M44 172 H66 V84 H90 V172 H108 V84 H124 C146 84 148 172 172 172 C192 172 196 112 212 112"
        fill="none" stroke="#FFFFFF" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="212" cy="112" r="13" fill="#FFD166"/>
</svg>
